<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <style>
      .t{fill:#e2e8f0;font-size:15px;font-weight:600}
      .s{fill:#94a3b8;font-size:11.5px}
      .lbl{fill:#cbd5e1;font-size:12px;font-weight:600}
      .arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#ah)}
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="560" fill="url(#bg)"/>
  <text x="480" y="42" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="700">云鉴 CloudSight AI · Dual-Engine Threat Detection</text>
  <text x="480" y="66" text-anchor="middle" class="s" font-size="13">IoT encrypted-traffic auditing · PCAP / URL / APK → 11-class verdict + report</text>

  <rect x="60" y="120" width="180" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="150" y="155" text-anchor="middle" class="t">输入 Input</text>
  <text x="150" y="178" text-anchor="middle" class="s">PCAP / .pcapng</text>
  <text x="150" y="195" text-anchor="middle" class="s">URL · APK</text>

  <rect x="300" y="120" width="180" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="390" y="150" text-anchor="middle" class="t">特征 + 图构建</text>
  <text x="390" y="172" text-anchor="middle" class="s">traffic parse → features</text>
  <text x="390" y="189" text-anchor="middle" class="s">flow graph (nodes+edges)</text>

  <rect x="540" y="120" width="180" height="90" rx="12" fill="#172554" stroke="#2563eb" stroke-width="1.5"/>
  <text x="630" y="150" text-anchor="middle" class="t" fill="#bfdbfe">推荐路由</text>
  <text x="630" y="170" text-anchor="middle" class="s">Recommendation</text>
  <text x="630" y="187" text-anchor="middle" class="s">router (auto / manual)</text>

  <rect x="540" y="270" width="360" height="100" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="560" y="300" class="t" fill="#86efac">⚡ 快速引擎 · Fast Lane</text>
  <text x="560" y="322" class="s">lightweight pretrained representation + retrieval augmentation</text>
  <text x="560" y="340" class="s">low training cost · sub-second · few-shot friendly</text>
  <text x="560" y="358" class="s">→ quick verdict</text>

  <rect x="540" y="400" width="360" height="110" rx="12" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
  <text x="560" y="430" class="t" fill="#e9d5ff">深度引擎 · Deep Lane</text>
  <text x="560" y="452" class="s">graph neural network + Transformer + retrieval-augmented (RAG)</text>
  <text x="560" y="470" class="s">high accuracy on 11-class IoT traffic, interpretable</text>
  <text x="560" y="488" class="s">+ optional LLM API (Gemini/OpenAI) → deep report</text>

  <rect x="60" y="330" width="320" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="360" class="t">报告 Output</text>
  <text x="80" y="384" class="s">· Verdict: Clean / Suspicious / Malicious</text>
  <text x="80" y="403" class="s">· Threat radar + confidence</text>
  <text x="80" y="422" class="s">· MITRE ATT&amp;CK mapping</text>
  <text x="80" y="441" class="s">· Multi-engine consensus (60+ vendors)</text>
  <text x="80" y="460" class="s">· Network telemetry forensics</text>

  <path class="arrow" d="M240,165 L298,165"/>
  <path class="arrow" d="M480,165 L538,165"/>
  <path class="arrow" d="M630,210 L630,268"/>
  <path class="arrow" d="M630,372 L630,398"/>
  <path class="arrow" d="M540,320 C440,320 440,400 382,405"/>
  <path class="arrow" d="M540,455 C450,455 440,455 382,455"/>
  <text x="700" y="245" class="lbl" fill="#60a5fa">small/simple → fast</text>
  <text x="700" y="392" class="lbl" fill="#c084fc">large/complex → deep</text>
</svg>